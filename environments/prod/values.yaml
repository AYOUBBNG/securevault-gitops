# ═══════════════════════════════════════
# Production Values
# ═══════════════════════════════════════
global:
  environment: production
  namespace: securevault-prod
  domain: securevault.com

image:
  registry: securevault-password-manager
  prefix: "securevault-password-manager-"	
  tag: latest
  pullPolicy: Never

replicaCounts:
  discovery: 1
  gateway: 1
  auth: 1
  vault: 1
  frontend: 1

resources:
  backend:
    requests:
      cpu: "100m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  frontend:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  database:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

database:
  auth:
    name: securevault_auth
    storage: 20Gi
  vault:
    name: securevault_vault
    storage: 20Gi

ingress:
  enabled: true
  className: nginx
  frontendHost: app.securevault.com
  gatewayHost: api.securevault.com

hpa:
  enabled: true
  auth:
    minReplicas: 3
    maxReplicas: 10
    cpuTarget: 70
  gateway:
    minReplicas: 3
    maxReplicas: 15
    cpuTarget: 70
  vault:
    minReplicas: 3
    maxReplicas: 10
    cpuTarget: 70