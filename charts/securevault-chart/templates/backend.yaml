# ═══════════════════════════════════════
# Discovery Service (Eureka)
# ═══════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "securevault.labels" . | nindent 4 }}
    app: discovery-service
spec:
  replicas: {{ .Values.replicaCounts.discovery }}
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: "{{ .Values.image.prefix }}discovery-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.global.environment }}"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: discovery-service
---
# ═══════════════════════════════════════
# Gateway Service
# ═══════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "securevault.labels" . | nindent 4 }}
    app: gateway-service
spec:
  replicas: {{ .Values.replicaCounts.gateway }}
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: "{{ .Values.image.prefix }}gateway-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.global.environment }}"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securevault-secrets
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: gateway-service
---
# ═══════════════════════════════════════
# Auth Service
# ═══════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "securevault.labels" . | nindent 4 }}
    app: auth-service
spec:
  replicas: {{ .Values.replicaCounts.auth }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.image.prefix }}auth-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.global.environment }}"
            - name: POSTGRES_URL
              value: "jdbc:postgresql://postgres-auth-db:5432/{{ .Values.database.auth.name }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: securevault-secrets
                  key: POSTGRES_AUTH_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securevault-secrets
                  key: POSTGRES_AUTH_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securevault-secrets
                  key: JWT_SECRET
            - name: EUREKA_SERVER_URL
              value: "http://discovery-service:8761/eureka/"
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: auth-service
---
# ═══════════════════════════════════════
